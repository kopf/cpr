[project]
name = "cpr"
version = "0.0.0"
description = "Monitors the health of docker containers and restarts them when necessary."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docker==6.1.3",
    "requests==2.31.0",
]

[dependency-groups]
dev = [
    "pytest==7.4.0",
    "responses==0.23.1",
]

[tool.uv]
package = false
